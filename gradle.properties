# Kotlin/Native compiles the iOS framework inside the Gradle daemon. Since 0.9.0-pre.10052 the release
# build ran out of 4 GB ("Java heap space"), hence 8 GB.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Version of local builds. Releases take the version from scripts/version.sh (.github/workflows/release.yml).
app.versionBase=0.1.0-beta
