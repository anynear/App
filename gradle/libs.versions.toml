# Versions deliberately aligned with meshtastic-sdk v0.2.0 (same Kotlin/Kable ABI).
# On SDK updates first compare its gradle/libs.versions.toml.
[versions]
kotlin                   = "2.4.10"
agp                      = "9.4.1"
androidMinSdk            = "26"
androidCompileSdk        = "37"
androidTargetSdk         = "37"
composeMultiplatform     = "1.12.1"
androidxActivityCompose  = "1.13.0"
coroutines               = "1.11.0"
meshtasticSdk            = "0.2.0"
kable                    = "0.45.0"
nordicDfu                = "2.10.1"
ktor                     = "3.5.2"
serialization            = "1.11.0"
cryptography             = "0.6.0"
bouncycastle             = "1.85"
multiplatformSettings    = "1.3.0"
qrose                    = "1.3.1"
camerax                  = "1.6.2"
zxing                    = "3.5.4"
androidxCredentials      = "1.6.0"
androidxFragment         = "1.8.9"
androidxWork             = "2.10.1"
playAppUpdate            = "2.1.0"

[libraries]
meshtastic-sdk-core           = { module = "org.meshtastic:sdk-core", version.ref = "meshtasticSdk" }
meshtastic-sdk-transport-ble  = { module = "org.meshtastic:sdk-transport-ble", version.ref = "meshtasticSdk" }
meshtastic-sdk-transport-tcp  = { module = "org.meshtastic:sdk-transport-tcp", version.ref = "meshtasticSdk" }
# Rescue via USB cable (ADR 0056): USB serial on the phone like Meshtastic-Android (MIT, JitPack).
usb-serial-android = { module = "com.github.mik3y:usb-serial-for-android", version = "3.11.0" }
meshtastic-sdk-storage        = { module = "org.meshtastic:sdk-storage-sqldelight", version.ref = "meshtasticSdk" }
kable                         = { module = "com.juul.kable:kable-core",             version.ref = "kable" }
# Topics in photos on device (ADR 0070): LiteRT, Apache-2.0, without Google services, from Google's Maven repository.
litert = { module = "com.google.ai.edge.litert:litert", version = "1.4.2" }
# Update radios (ADR 0056): nRF52 via legacy DFU, BSD-3-Clause.
nordic-dfu                    = { module = "no.nordicsemi.android:dfu",             version.ref = "nordicDfu" }
coroutines-core               = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test               = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
ktor-client-core              = { module = "io.ktor:ktor-client-core",              version.ref = "ktor" }
ktor-client-okhttp            = { module = "io.ktor:ktor-client-okhttp",            version.ref = "ktor" }
ktor-client-darwin            = { module = "io.ktor:ktor-client-darwin",            version.ref = "ktor" }
serialization-json            = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
serialization-cbor            = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "serialization" }
cryptography-core             = { module = "dev.whyoleg.cryptography:cryptography-core",             version.ref = "cryptography" }
cryptography-provider-jdk     = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk",     version.ref = "cryptography" }
cryptography-provider-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptography" }
bouncycastle                  = { module = "org.bouncycastle:bcprov-jdk18on",       version.ref = "bouncycastle" }
qrose                         = { module = "io.github.alexzhirkevich:qrose",        version.ref = "qrose" }
camerax-camera2               = { module = "androidx.camera:camera-camera2",        version.ref = "camerax" }
camerax-lifecycle             = { module = "androidx.camera:camera-lifecycle",      version.ref = "camerax" }
camerax-view                  = { module = "androidx.camera:camera-view",           version.ref = "camerax" }
zxing-core                    = { module = "com.google.zxing:core",                 version.ref = "zxing" }
multiplatform-settings        = { module = "com.russhwolf:multiplatform-settings",  version.ref = "multiplatformSettings" }
androidx-activity-compose     = { module = "androidx.activity:activity-compose",    version.ref = "androidxActivityCompose" }
androidx-credentials          = { module = "androidx.credentials:credentials",     version.ref = "androidxCredentials" }
androidx-fragment             = { module = "androidx.fragment:fragment",           version.ref = "androidxFragment" }
# Find new documents automatically (ADR 0080): WorkManager, AndroidX, without Google services.
androidx-work                 = { module = "androidx.work:work-runtime-ktx",       version.ref = "androidxWork" }
# Google Play In-App Updates (ADR 0096 §6, §7), only in the flavor `play`, never in `direct`.
play-app-update-ktx           = { module = "com.google.android.play:app-update-ktx", version.ref = "playAppUpdate" }
compose-components-resources  = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

[plugins]
kotlinMultiplatform               = { id = "org.jetbrains.kotlin.multiplatform",     version.ref = "kotlin" }
androidApplication                = { id = "com.android.application",                version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform              = { id = "org.jetbrains.compose",                  version.ref = "composeMultiplatform" }
composeCompiler                   = { id = "org.jetbrains.kotlin.plugin.compose",    version.ref = "kotlin" }
kotlinSerialization               = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
